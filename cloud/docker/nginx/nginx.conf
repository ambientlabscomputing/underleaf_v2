worker_processes auto;

events {
    worker_connections 1024;
}

# ---------------------------------------------------------------------------
# HTTP context
#
# Handles all "northbound" traffic terminating on the public HTTPS port:
#   1. Accounts UI  -> Cloud API   (Bearer token, see README "UI request")
#   2. Node/Cluster -> Cloud API   (mTLS, see README "Node HTTP + TLS request")
#   3. Gateway clients (*.gw.<domain>) -> Conn Worker gateway port
#      (see README "Join Stream request (Southbound / client-side)")
# ---------------------------------------------------------------------------
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Upstream service names below assume Docker Compose / Kubernetes service
    # discovery names on the shared network. Adjust to match your deployment.
    # (Accounts UI is not an upstream -- it's a static build served directly
    # by this nginx container, see the /usr/share/nginx/html/account_ui root
    # below and mount it there via a Docker volume/bind mount.)
    upstream cloud_api {
        server cloud_api:8080;
    }

    upstream conn_worker_gateway {
        server conn_worker:9020;
    }

    # conn_worker's remote-access relay (RFD 5, step 7b). Internal only: it is
    # not published and nothing but this nginx should be able to reach it. It
    # forwards HTTP (and WebSocket upgrades) onto a stream it opens toward the
    # cluster's agent. It trusts nothing: the Orchestrator verifies the
    # assertion that nginx attaches below.
    upstream conn_worker_relay {
        server conn_worker:9071;
    }

    # Standard websocket/Upgrade passthrough helper (used by the gateway
    # server block, since gateway traffic is arbitrary, long-lived HTTP
    # traffic bridged onto a node's yamux stream).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Only forward X-Subject-Id when the client presented a certificate that
    # nginx successfully verified against our root CA. cloud_api's
    # x_subject_id_token_middleware_ mints a short-lived Bearer token from
    # this header (see cloud_api/interface/deps.py). Certs are issued with
    # CN=<node_id|cluster_id> (see cloud_api/lib/cert_lib.py::sign_csr), so
    # extracting CN from the verified subject DN gives us exactly the
    # subject id we need.
    #
    # NOTE: proxy_set_header drops the header entirely when the value is an
    # empty string, so unauthenticated (no client cert) requests never send
    # X-Subject-Id, leaving Bearer-token auth untouched.
    map $ssl_client_s_dn $ssl_client_common_name {
        default "";
        "~(?:^|,)CN=(?<cn>[^,]+)" $cn;
    }

    map $ssl_client_verify $x_subject_id {
        default "";
        SUCCESS $ssl_client_common_name;
    }

    # The cluster id in /api/v2/cloud/clusters/<cluster_id>/remote/..., as seen
    # by the auth subrequest (which cannot see the parent location's regex
    # captures; $request_uri is the original request's in both).
    map $request_uri $remote_cluster_id {
        default "";
        "~^/api/v2/cloud/clusters/(?<rc>[^/?]+)/remote(?:[/?]|$)" $rc;
    }

    # Plain HTTP -> HTTPS redirect
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # Main gateway: Accounts UI + Cloud API
    #
    # ssl_verify_client is "optional" so this single listener serves both:
    #   - browsers / UI clients that authenticate with a Bearer token, and
    #   - nodes/clusters that authenticate with an mTLS client certificate.
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name underleafapp.com www.underleafapp.com;

        # A normal server certificate, issued from the cluster CA by cloud_api
        # at startup (cloud_api/lib/tls_lib.py) with the names clusters dial in
        # its subjectAltName. nginx holds only this certificate's own key. The
        # CA key (which signs device certificates) and the OAuth JWT key stay
        # in cloud_api; /etc/nginx/certs is a directory that contains neither.
        ssl_certificate     /etc/nginx/certs/server_cert.pem;
        ssl_certificate_key /etc/nginx/certs/server_key.pem;

        # The public CA certificate, trusted for validating node/cluster
        # client certs.
        ssl_client_certificate /etc/nginx/certs/root_ca_cert.pem;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        # Remote access to a cluster's Orchestrator (RFD 5, step 7b): Cockpit
        # and `ufctl connect`.
        #
        #   1. auth_request asks cloud_api who the caller is (device key or
        #      account token), whether that account owns the cluster, and for a
        #      fresh short-lived cloud-signed assertion plus the id of the
        #      cluster's standing tunnel connection.
        #   2. The request is proxied to conn_worker's relay, which opens a
        #      stream down that tunnel to the cluster's agent.
        #   3. The Orchestrator's remote listener verifies the assertion.
        #
        # Whatever assertion, connection id, identity or credential headers the
        # client sent are discarded: only the values cloud_api returned are
        # forwarded. mTLS identity (X-Subject-Id) is never used on this path.
        # Longest-regex-wins over the generic /api/v2/cloud/ prefix below.
        location ~ ^/api/v2/cloud/clusters/[^/]+/remote(?:/|$) {
            auth_request /_remote_auth;
            auth_request_set $ul_assertion  $upstream_http_x_underleaf_assertion;
            auth_request_set $ul_connection $upstream_http_x_underleaf_connection;

            # Strip the /clusters/<id>/remote prefix; the relay (and the
            # Orchestrator behind it) see the path the UI and API expect.
            rewrite ^/api/v2/cloud/clusters/[^/]+/remote$ / break;
            rewrite ^/api/v2/cloud/clusters/[^/]+/remote(/.*)$ $1 break;

            proxy_pass http://conn_worker_relay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # An empty value removes the header. If cloud_api returned no
            # connection id the relay answers 503 "cluster is not connected".
            proxy_set_header X-Underleaf-Assertion  $ul_assertion;
            proxy_set_header X-Underleaf-Connection $ul_connection;
            proxy_set_header X-Subject-Id "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";

            # Log streams and WebSockets: stream, never buffer; long-lived.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Subrequest target of the auth_request above. Not reachable by clients.
        location = /_remote_auth {
            internal;
            proxy_pass http://cloud_api/api/v2/cloud/internal/remote-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            # Authorization (the caller's credential) passes through untouched.
            # The cluster id comes from the URL, never from the client.
            proxy_set_header X-Underleaf-Cluster $remote_cluster_id;
            proxy_set_header X-Subject-Id "";
            proxy_set_header X-Underleaf-Assertion "";
            proxy_set_header X-Underleaf-Connection "";
        }

        # Internal-only cloud_api routes (the auth endpoint above). cloud_api
        # also refuses to authenticate through X-Subject-Id there, but there is
        # no reason to let the internet reach them at all.
        location ^~ /api/v2/cloud/internal/ {
            return 404;
        }

        # Node/Cluster <-> Cloud API (mTLS or Bearer token)
        location /api/v2/cloud/ {
            proxy_pass http://cloud_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Bearer token requests pass Authorization through untouched.
            # mTLS requests get X-Subject-Id injected (see map above); empty
            # value means the header is simply not sent.
            proxy_set_header X-Subject-Id $x_subject_id;
        }

        # Accounts UI -- static build (`npm run build` output, i.e. the
        # account_ui/dist directory) mounted read-only into the container.
        root /usr/share/nginx/html/account_ui;
        index index.html;

        location / {
            # SPA fallback: unmatched paths (client-side routes) serve
            # index.html so react-router can take over.
            try_files $uri $uri/ /index.html;
        }
    }

    # -----------------------------------------------------------------------
    # Pinned listener: the assertion key set (RFD 5)
    #
    # Orchestrators fetch the key set that verifies remote-access assertions
    # from here, trusting ONLY the CA chain pinned at registration and checking
    # the host name against the certificate. This listener always presents the
    # CA-issued server certificate. If the main :443 listener is ever switched
    # to a publicly trusted certificate for browsers, this one must keep
    # presenting the CA-issued one, which is why it is a separate port rather
    # than a path on :443. It serves exactly one path and never asks for a
    # client certificate.
    # -----------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server_cert.pem;
        ssl_certificate_key /etc/nginx/certs/server_key.pem;
        ssl_verify_client off;

        location = /api/v2/cloud/assertion-keys {
            limit_except GET { deny all; }
            proxy_pass http://cloud_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Never forward a subject id on this listener.
            proxy_set_header X-Subject-Id "";
        }

        location / {
            return 404;
        }
    }

    # -----------------------------------------------------------------------
    # Gateway client access: https://<stream-id>.gw.underleafapp.com
    #
    # "Naive" clients terminate TLS here just like any other HTTPS server.
    # Conn Worker's GatewayServer parses the stream id back out of the Host
    # header itself, so the Host header MUST be forwarded unmodified and the
    # request must not be buffered/rewritten. No client cert is required.
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^(?<stream_id>.+)\.gw\.underleafapp\.com$;

        ssl_certificate     /etc/nginx/certs/server_cert.pem;
        ssl_certificate_key /etc/nginx/certs/server_key.pem;

        location / {
            proxy_pass http://conn_worker_gateway;
            proxy_http_version 1.1;

            # Preserve the original Host header (contains the stream id) --
            # do NOT rewrite this to the upstream address.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Allow long-lived/upgraded connections and avoid buffering so
            # data is bridged to the node's stream as it arrives.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}

# ---------------------------------------------------------------------------
# Stream (L4) context
#
# Southbound node connections: TargetNodeAgent dials in with mTLS to start a
# new tunnel (see README "Start Stream request (Southbound / node-side)").
# After the initial HTTP request that Conn Worker's ConnectionManager reads to
# identify the connection, the raw TCP connection is repurposed for a yamux
# multiplexed binary session -- it is NOT plain HTTP end-to-end, so this must
# be a TCP-level passthrough (not an http proxy_pass) once TLS is terminated.
# ---------------------------------------------------------------------------
stream {
    server {
        listen 19021 ssl;

        ssl_certificate     /etc/nginx/certs/server_cert.pem;
        ssl_certificate_key /etc/nginx/certs/server_key.pem;

        # Nodes must present a certificate signed by our root CA.
        ssl_client_certificate /etc/nginx/certs/root_ca_cert.pem;
        ssl_verify_client on;

        proxy_pass conn_worker:9021;

        # These connections are long-lived (yamux session for the lifetime
        # of the tunnel), so avoid nginx closing them on idle.
        proxy_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}