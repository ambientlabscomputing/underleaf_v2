worker_processes auto;

events {
    worker_connections 1024;
}

# ---------------------------------------------------------------------------
# HTTP context
#
# Handles all "northbound" traffic terminating on the public HTTPS port:
#   1. Accounts UI  -> Cloud API   (Bearer token, see README "UI request")
#   2. Node/Cluster -> Cloud API   (mTLS, see README "Node HTTP + TLS request")
#   3. Gateway clients (*.gw.<domain>) -> Conn Worker gateway port
#      (see README "Join Stream request (Southbound / client-side)")
# ---------------------------------------------------------------------------
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Upstream service names below assume Docker Compose / Kubernetes service
    # discovery names on the shared network. Adjust to match your deployment.
    # (Accounts UI is not an upstream -- it's a static build served directly
    # by this nginx container, see the /usr/share/nginx/html/account_ui root
    # below and mount it there via a Docker volume/bind mount.)
    upstream cloud_api {
        server cloud_api:8080;
    }

    upstream conn_worker_gateway {
        server conn_worker:9020;
    }

    # Standard websocket/Upgrade passthrough helper (used by the gateway
    # server block, since gateway traffic is arbitrary, long-lived HTTP
    # traffic bridged onto a node's yamux stream).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Only forward X-Subject-Id when the client presented a certificate that
    # nginx successfully verified against our root CA. cloud_api's
    # x_subject_id_token_middleware_ mints a short-lived Bearer token from
    # this header (see cloud_api/interface/deps.py). Certs are issued with
    # CN=<node_id|cluster_id> (see cloud_api/lib/cert_lib.py::sign_csr), so
    # extracting CN from the verified subject DN gives us exactly the
    # subject id we need.
    #
    # NOTE: proxy_set_header drops the header entirely when the value is an
    # empty string, so unauthenticated (no client cert) requests never send
    # X-Subject-Id, leaving Bearer-token auth untouched.
    map $ssl_client_s_dn $ssl_client_common_name {
        default "";
        "~(?:^|,)CN=(?<cn>[^,]+)" $cn;
    }

    map $ssl_client_verify $x_subject_id {
        default "";
        SUCCESS $ssl_client_common_name;
    }

    # Plain HTTP -> HTTPS redirect
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # Main gateway: Accounts UI + Cloud API
    #
    # ssl_verify_client is "optional" so this single listener serves both:
    #   - browsers / UI clients that authenticate with a Bearer token, and
    #   - nodes/clusters that authenticate with an mTLS client certificate.
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name underleafapp.com www.underleafapp.com;

        # cloud_api self-provisions this root CA cert/key pair on startup
        # (see cloud_api/lib/auth_lib.py::__bootstrap_certs) and uses it for
        # OAuth JWT signing and for signing device CSRs. We reuse the exact
        # same cert/key here for TLS termination and client-cert validation
        # so there is a single source of truth for certs across the stack.
        ssl_certificate     /etc/nginx/certs/root_ca_cert.pem;
        ssl_certificate_key /etc/nginx/certs/private_key.pem;

        # Root CA trusted for validating node/cluster client certs -- same
        # file as above.
        ssl_client_certificate /etc/nginx/certs/root_ca_cert.pem;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        # Node/Cluster <-> Cloud API (mTLS or Bearer token)
        location /api/v2/cloud/ {
            proxy_pass http://cloud_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Bearer token requests pass Authorization through untouched.
            # mTLS requests get X-Subject-Id injected (see map above); empty
            # value means the header is simply not sent.
            proxy_set_header X-Subject-Id $x_subject_id;
        }

        # Accounts UI -- static build (`npm run build` output, i.e. the
        # account_ui/dist directory) mounted read-only into the container.
        root /usr/share/nginx/html/account_ui;
        index index.html;

        location / {
            # SPA fallback: unmatched paths (client-side routes) serve
            # index.html so react-router can take over.
            try_files $uri $uri/ /index.html;
        }
    }

    # -----------------------------------------------------------------------
    # Gateway client access: https://<stream-id>.gw.underleafapp.com
    #
    # "Naive" clients terminate TLS here just like any other HTTPS server.
    # Conn Worker's GatewayServer parses the stream id back out of the Host
    # header itself, so the Host header MUST be forwarded unmodified and the
    # request must not be buffered/rewritten. No client cert is required.
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^(?<stream_id>.+)\.gw\.underleafapp\.com$;

        ssl_certificate     /etc/nginx/certs/root_ca_cert.pem;
        ssl_certificate_key /etc/nginx/certs/private_key.pem;

        location / {
            proxy_pass http://conn_worker_gateway;
            proxy_http_version 1.1;

            # Preserve the original Host header (contains the stream id) --
            # do NOT rewrite this to the upstream address.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Allow long-lived/upgraded connections and avoid buffering so
            # data is bridged to the node's stream as it arrives.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}

# ---------------------------------------------------------------------------
# Stream (L4) context
#
# Southbound node connections: TargetNodeAgent dials in with mTLS to start a
# new tunnel (see README "Start Stream request (Southbound / node-side)").
# After the initial HTTP request that Conn Worker's ConnectionManager reads to
# identify the connection, the raw TCP connection is repurposed for a yamux
# multiplexed binary session -- it is NOT plain HTTP end-to-end, so this must
# be a TCP-level passthrough (not an http proxy_pass) once TLS is terminated.
# ---------------------------------------------------------------------------
stream {
    server {
        listen 19021 ssl;

        ssl_certificate     /etc/nginx/certs/root_ca_cert.pem;
        ssl_certificate_key /etc/nginx/certs/private_key.pem;

        # Nodes must present a certificate signed by our root CA.
        ssl_client_certificate /etc/nginx/certs/root_ca_cert.pem;
        ssl_verify_client on;

        proxy_pass conn_worker:9021;

        # These connections are long-lived (yamux session for the lifetime
        # of the tunnel), so avoid nginx closing them on idle.
        proxy_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}