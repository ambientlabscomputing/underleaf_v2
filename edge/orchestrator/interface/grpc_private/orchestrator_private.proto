syntax = "proto3";

package orchestrator.private.v1;

option go_package = "github.com/ambientlabscomputing/underleaf_v2/edge/orchestrator/interface/grpc_private";

// OrchestratorPrivate is the CLI-facing gRPC service, served over a unix socket.
service OrchestratorPrivate {
  rpc GetNodes(GetNodesRequest) returns (GetNodesResponse);
  rpc SqlQuery(SqlQueryRequest) returns (SqlQueryResponse);
  rpc TriggerIngest(TriggerIngestRequest) returns (TriggerIngestResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc InitiateCloudRegistration(InitiateCloudRegistrationRequest) returns (InitiateCloudRegistrationResponse);
  rpc GetCloudRegistrationStatus(GetCloudRegistrationStatusRequest) returns (GetCloudRegistrationStatusResponse);
}

message GetNodesRequest {
    optional int64 limit = 1;
    optional int64 offset = 2;
    optional string order_by = 3;
    optional string order = 4;
    optional string search = 5;
    optional string name = 6;
    optional string os = 7;
    optional string arch = 8;
}

message GetNodesResponse {
  repeated Node results = 1;
  int64 count = 2;
  int64 total = 3;
  GetNodesRequest query = 4;
}

message Node {
  string id   = 1;
  string name = 2;
}

message SqlQueryRequest{
    string query = 1;
}

message SqlQueryResponse {
    string result = 1;
}

message TriggerIngestRequest {}

message TriggerIngestResponse {
  int32 container_count = 1;
}

message Container {
  string id        = 1;
  string docker_id = 2;
  string node_id   = 3;
  string image     = 4;
  string status    = 5;
  int64  uptime    = 6;
}

message ListContainersRequest {}

message ListContainersResponse {
  repeated Container containers = 1;
}

message InitiateCloudRegistrationRequest {
  string cluster_name = 1;
  string cluster_id   = 2;
}

message InitiateCloudRegistrationResponse {
  string user_code                  = 1;
  string verification_uri_complete  = 2;
  int32  expires_in                 = 3;
  int32  interval                   = 4;
}

message GetCloudRegistrationStatusRequest {}

message GetCloudRegistrationStatusResponse {
  string status     = 1;
  string cluster_id = 2;
}
