syntax = "proto3";

import "google/protobuf/empty.proto";

package orchestrator.private.v1;

option go_package = "github.com/ambientlabscomputing/underleaf_v2/edge/orchestrator/interface/grpc_private";

// OrchestratorPrivate is the CLI-facing gRPC service, served over a unix socket.
service OrchestratorPrivate {
  rpc GetNodes(GetNodesRequest) returns (GetNodesResponse);
  rpc SqlQuery(SqlQueryRequest) returns (SqlQueryResponse);
  rpc TriggerIngest(TriggerIngestRequest) returns (TriggerIngestResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc InitiateCloudRegistration(InitiateCloudRegistrationRequest) returns (InitiateCloudRegistrationResponse);
  rpc NewStream(NewStreamRequest) returns (Stream);
  rpc CloseStream(CloseStreamRequest) returns (google.protobuf.Empty);
  rpc GetStream(GetStreamRequest) returns (StreamState);
  rpc ListStreams(google.protobuf.Empty) returns (stream StreamState);
  rpc GetCloudRegistrationStatus(GetCloudRegistrationStatusRequest) returns (GetCloudRegistrationStatusResponse);

  // Deployment RPCs — track 2 (manifest & deploy).
  rpc Deploy(DeployRequest) returns (DeployResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc GetDeployment(GetDeploymentRequest) returns (Deployment);
}

message GetNodesRequest {
    optional int64 limit = 1;
    optional int64 offset = 2;
    optional string order_by = 3;
    optional string order = 4;
    optional string search = 5;
    optional string name = 6;
    optional string os = 7;
    optional string arch = 8;
}

message GetNodesResponse {
  repeated Node results = 1;
  int64 count = 2;
  int64 total = 3;
  GetNodesRequest query = 4;
}

message Node {
  string id   = 1;
  string name = 2;
}

message SqlQueryRequest{
    string query = 1;
}

message SqlQueryResponse {
    string result = 1;
}

message TriggerIngestRequest {}

message TriggerIngestResponse {
  int32 container_count = 1;
}

message Container {
  string id        = 1;
  string docker_id = 2;
  string node_id   = 3;
  string image     = 4;
  string status    = 5;
  int64  uptime    = 6;
}

message ListContainersRequest {}

message ListContainersResponse {
  repeated Container containers = 1;
}

message InitiateCloudRegistrationRequest {
  string cluster_name = 1;
  string cluster_id   = 2;
}

message InitiateCloudRegistrationResponse {
  string user_code                  = 1;
  string verification_uri_complete  = 2;
  int32  expires_in                 = 3;
  int32  interval                   = 4;
}

message GetCloudRegistrationStatusRequest {}

message GetCloudRegistrationStatusResponse {
  string status     = 1;
  string cluster_id = 2;
}

message NewStreamRequest {
  string node_id      = 1;
  string type         = 2;
  int32  port         = 3;
}

message CloseStreamRequest {
  string stream_id = 1;
}

message StreamState {
    string stream_id = 1;
    string type = 2;
    string connection_id = 3;
    string state = 4;
}

message GetStreamRequest {
    string stream_id = 1;
}

message Stream {
    string id = 1;
    string connection_id = 2;
    string type = 3;
    string state = 4;
    string status = 5;
    int32 port = 6;
    string created_at = 7;
    string closed_at = 8;
}

// ── Deployment messages ─────────────────────────────────────────────────────

message BuildSpec {
  string context    = 1;
  string dockerfile = 2;
  map<string, string> args = 3;
}

message ExposeSpec {
  int32  port     = 1;
  string hostname = 2;
}

message SourceRef {
  string owner       = 1;
  string repo        = 2;
  string ref         = 3;
  string archive_url = 4;
}

message ServiceSpec {
  string name        = 1;
  string image       = 2;
  BuildSpec build    = 3;
  repeated string ports = 4;
  map<string, string> environment = 5;
  repeated string networks = 6;
  repeated string volumes  = 7;
  ExposeSpec expose  = 8;
  SourceRef source   = 9;
}

message DeploymentNetworkSpec {
  string name   = 1;
  string driver = 2;
}

message DeploymentVolumeSpec {
  string name = 1;
}

message DeploymentSpec {
  string version = 1;
  string name    = 2;
  string slug    = 3;
  repeated ServiceSpec services = 4;
  repeated DeploymentNetworkSpec networks = 5;
  repeated DeploymentVolumeSpec  volumes  = 6;
}

message Deployment {
  string id     = 1;
  string repo   = 2;
  string ref    = 3;
  DeploymentSpec spec = 4;
  string status = 5; // "in_progress" | "succeeded" | "failed"
  string error  = 6; // populated when status is "failed"
}

message DeployRequest {
  string source = 1; // "gh:<owner>/<repo>[@ref]"
  string ref    = 2; // optional; overrides any "@ref" embedded in source
  string token  = 3; // optional GitHub token, for private repos
}

message DeployResponse {
  // status is always "in_progress" here — reconcile runs in the background,
  // poll GetDeployment for the outcome.
  Deployment deployment = 1;
}

message ListDeploymentsRequest {}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
}

message GetDeploymentRequest {
  string id = 1;
}