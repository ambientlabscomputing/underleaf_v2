syntax = "proto3";

package orchestrator.public.v1;

option go_package = "github.com/ambientlabscomputing/underleaf_v2/edge/orchestrator/interface/grpc_public";

// OrchestratorPublic is the agent-facing gRPC service, served over TCP.
service OrchestratorPublic {
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc GetNodes(GetNodesRequest) returns (GetNodesResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ReportContainers(ReportContainersRequest) returns (ReportContainersResponse);
}

message GetNodesRequest {
  optional int64  limit    = 1;
  optional int64  offset   = 2;
  optional string order_by = 3;
  optional string order    = 4;
  optional string search   = 5;
  optional string name     = 6;
  optional string os       = 7;
  optional string arch     = 8;
}

message GetNodesResponse {
  repeated Node    results = 1;
  int64            count   = 2;
  int64            total   = 3;
  GetNodesRequest  query   = 4;
}

message Node {
  string id         = 1;
  string name       = 2;
  string ip_address = 3;
  string os         = 4;
  string arch       = 5;
}

message PingRequest {
  string source           = 1;
  int64  timestamp_unix_ms = 2;
}

message PingResponse {
  string responder        = 1;
  int64  timestamp_unix_ms = 2;
}

message CreateNodeRequest {
    string name = 1;
    string ip_address = 2;
	string os = 3;
	string arch = 4;
}

message CreateNodeResponse {
    string id = 1;
    string name = 2;
    string ip_address = 3;
	string os = 4;
	string arch = 5;
}

message Container {
  string id        = 1;
  string docker_id = 2;
  string node_id   = 3;
  string image     = 4;
  string status    = 5;
  int64  uptime    = 6;
  string name      = 7;
}

message ReportContainersRequest {
  string             node_id    = 1;
  repeated Container containers = 2;
}

message ReportContainersResponse {
  int32 accepted = 1;
}
