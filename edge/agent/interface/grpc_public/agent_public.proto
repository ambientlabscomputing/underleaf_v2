syntax = "proto3";
import "google/protobuf/empty.proto";

package agent.public.v1;

option go_package = "github.com/ambientlabscomputing/underleaf_v2/edge/agent/interface/grpc_public";

// AgentPublic is the orchestrator/agent-facing gRPC service, served over TCP.
service AgentPublic {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc IngestContainers(IngestContainersRequest) returns (IngestContainersResponse);
  rpc GetNode(google.protobuf.Empty) returns (Node);

  // Stream RPCs
  rpc NewStream(NewStreamRequest) returns (google.protobuf.Empty);
  rpc CloseStream(CloseStreamRequest) returns (google.protobuf.Empty);
  rpc GetStream(GetStreamRequest) returns (StreamState);
  rpc ListStreams(google.protobuf.Empty) returns (stream StreamState);

  // Log RPCs — agent is the source of truth for container logs.
  rpc GetContainerLogs(GetContainerLogsRequest) returns (GetContainerLogsResponse);
  rpc StreamContainerLogs(StreamContainerLogsRequest) returns (stream LogLine);

  // Deployment lifecycle RPCs — orchestrator-initiated container/volume
  // management. The orchestrator owns naming/identity decisions (names are
  // already namespaced by the time they reach the agent); the agent is a
  // thin, stateless-per-call Docker executor. Responses are accept/error
  // only — a pull or build can take tens of seconds, so these don't block
  // on it. Final state surfaces through the existing ReportContainers push.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse);
  rpc StartContainer(ContainerNameRequest) returns (google.protobuf.Empty);
  rpc StopContainer(ContainerNameRequest) returns (google.protobuf.Empty);
  rpc RemoveContainer(ContainerNameRequest) returns (google.protobuf.Empty);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
}

message PingRequest {
  string source           = 1;
  int64  timestamp_unix_ms = 2;
}

message PingResponse {
  string responder        = 1;
  int64  timestamp_unix_ms = 2;
}

message Container {
  string id        = 1;
  string docker_id = 2;
  string node_id   = 3;
  string image     = 4;
  string status    = 5;
  int64  uptime    = 6;
  string name      = 7;
}

message IngestContainersRequest {}

message IngestContainersResponse {
  repeated Container containers = 1;
}

// ── Log messages ─────────────────────────────────────────────────────────────

message LogLine {
  string docker_id = 1;
  int64  ts_ms     = 2;
  string stream    = 3; // "stdout" or "stderr"
  string message   = 4;
}

message GetContainerLogsRequest {
  string docker_id = 1;
  int64  since_ms  = 2; // 0 = beginning of buffer
  int64  until_ms  = 3; // 0 = no upper bound
  int32  limit     = 4; // 0 = server default (100)
  int64  cursor_id = 5; // row id pagination cursor; 0 = start
}

message GetContainerLogsResponse {
  repeated LogLine lines       = 1;
  int64            next_cursor = 2; // 0 = no more pages
}

message StreamContainerLogsRequest {
  string docker_id = 1;
  int64  since_ms  = 2; // 0 = tail only (no history replay)
}

message Node {
  string id          = 1;
  string name        = 2;
  string ip_address  = 3;
  string os          = 4;
  string arch        = 5;
}

message NewStreamRequest {
  string connection_id = 1;
  string stream_id = 2;
  string type      = 3;
  int32  port      = 4;
}

message CloseStreamRequest {
  string stream_id = 1;
}

message StreamState {
    string stream_id = 1;
    string type = 2;
    string connection_id = 3;
    string state = 4;
}

message GetStreamRequest {
    string stream_id = 1;
}

// ── Deployment lifecycle messages ───────────────────────────────────────────

message BuildSource {
  string archive_url = 1; // downloadable tarball of the build context
  string context     = 2; // sub-directory within the archive, e.g. "."
  string dockerfile  = 3; // path to the Dockerfile within context
  map<string, string> args = 4;
}

message CreateContainerRequest {
  string name = 1; // desired container name; already namespaced by the orchestrator
  string image = 2; // set when not building from source
  BuildSource build = 3; // set when building from source; mutually exclusive with image
  map<string, string> environment = 4;
  repeated string ports   = 5; // "hostPort:containerPort"
  repeated string volumes = 6; // "volumeName:/container/path"; volumeName already namespaced
  map<string, string> labels = 7;
}

message CreateContainerResponse {
  string docker_id = 1;
}

message ContainerNameRequest {
  string name = 1;
}

message CreateVolumeRequest {
  string name   = 1; // already namespaced by the orchestrator
  string driver = 2; // optional, defaults to "local"
  map<string, string> labels = 3;
}

message CreateVolumeResponse {
  string name = 1;
}

message ListVolumesRequest {}

message VolumeInfo {
  string name   = 1;
  string driver = 2;
  map<string, string> labels = 3;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
}