syntax = "proto3";

package agent.private.v1;

option go_package = "github.com/ambientlabscomputing/underleaf_v2/edge/agent/interface/grpc_private";

// AgentPrivate is the CLI-facing gRPC service, served over a unix socket.
service AgentPrivate {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc IngestContainers(IngestContainersRequest) returns (IngestContainersResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
}

message PingRequest {}

message PingResponse {
  // Agent's own ping result
  string agent_status        = 1;
  int64  agent_timestamp_ms  = 2;
  // Result from the agent pinging the orchestrator
  bool   orchestrator_reachable  = 3;
  string orchestrator_responder  = 4;
  int64  orchestrator_timestamp_ms = 5;
  string orchestrator_error      = 6;
}

message RegisterRequest {}

message Node {
    string id = 1;
    string name = 2;
}

message RegisterResponse {
    string status = 1;
    Node node = 2;
}

message Container {
  string id        = 1;
  string docker_id = 2;
  string node_id   = 3;
  string image     = 4;
  string status    = 5;
  int64  uptime    = 6;
}

message IngestContainersRequest {}

message IngestContainersResponse {
  repeated Container containers = 1;
}

message ListContainersRequest {}

message ListContainersResponse {
  repeated Container containers = 1;
}