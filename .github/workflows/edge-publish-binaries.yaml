name: Edge Publish

on:
  push:
    branches:
      - develop
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  # ── Binary builds ──────────────────────────────────────────────────────────
  build-binaries:
    name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set build tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "value=-tags devmode" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi

      - name: Build
        working-directory: edge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" ${{ steps.tags.outputs.value }} -o bin/ufagent-${{ matrix.goos }}-${{ matrix.goarch }}      ./agent/cmd/ufagent
          go build -ldflags="-s -w" ${{ steps.tags.outputs.value }} -o bin/ufagentd-${{ matrix.goos }}-${{ matrix.goarch }}     ./agent/cmd/ufagentd
          go build -ldflags="-s -w" ${{ steps.tags.outputs.value }} -o bin/orcli-${{ matrix.goos }}-${{ matrix.goarch }}         ./orchestrator/cmd/cli
          go build -ldflags="-s -w" ${{ steps.tags.outputs.value }} -o bin/orch-server-${{ matrix.goos }}-${{ matrix.goarch }} ./orchestrator/cmd/server
          go build -ldflags="-s -w" ${{ steps.tags.outputs.value }} -o bin/ufctl-${{ matrix.goos }}-${{ matrix.goarch }}         ./cmd/ufctl

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: edge/bin/

  # ── Orchestrator UI ────────────────────────────────────────────────────────
  # The Orchestrator serves these static files next to its API (UNDERLEAF_UI_DIR);
  # install.sh downloads and unpacks them with the binaries.
  build-ui:
    name: Build Orchestrator UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/orchestrator_ui/package-lock.json

      - name: Build
        working-directory: edge/orchestrator_ui
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          mkdir -p ui-release
          tar -czf ui-release/underleaf-ui.tar.gz -C edge/orchestrator_ui/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: ui-release/

  # ── development release ────────────────────────────────────────────────────
  publish-development:
    name: Publish development release
    needs: [build-binaries, build-ui]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Recreate development release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Named "development", not "develop" -- a git tag literally named
          # "develop" is ambiguous with the "develop" branch (git push/fetch
          # can't tell them apart without a fully-qualified refspec).
          gh release delete development --yes --cleanup-tag 2>/dev/null || true
          gh release create development artifacts/* \
            --title "development" \
            --notes "Latest develop build — commit ${{ github.sha }}"

  # ── semver release ─────────────────────────────────────────────────────────
  publish-semver:
    name: Publish semver release
    needs: [build-binaries, build-ui]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get tag
        id: tag
        run: echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" artifacts/* \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "Release ${{ steps.tag.outputs.name }}"

      - name: Overwrite latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest artifacts/* \
            --title "latest (${{ steps.tag.outputs.name }})" \
            --notes "Latest stable release — ${{ steps.tag.outputs.name }}"
