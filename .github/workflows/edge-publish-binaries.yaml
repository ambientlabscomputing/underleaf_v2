name: Edge Publish

on:
  push:
    branches:
      - develop
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  IMAGE_NAME: ghcr.io/ambientlabscomputing/underleaf

jobs:
  # ── Binary builds ──────────────────────────────────────────────────────────
  build-binaries:
    name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: edge/go.mod
          cache-dependency-path: edge/go.sum

      - name: Build
        working-directory: edge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o bin/ufagent-${{ matrix.goos }}-${{ matrix.goarch }}  ./agent/cmd/ufagent
          go build -ldflags="-s -w" -o bin/ufagentd-${{ matrix.goos }}-${{ matrix.goarch }} ./agent/cmd/ufagentd
          go build -ldflags="-s -w" -o bin/orcli-${{ matrix.goos }}-${{ matrix.goarch }}    ./orchestrator/cmd/cli

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: edge/bin/

  # ── develop release ────────────────────────────────────────────────────────
  publish-develop:
    name: Publish develop release
    needs: build-binaries
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Recreate develop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete develop --yes --cleanup-tag 2>/dev/null || true
          gh release create develop artifacts/* \
            --title "develop" \
            --notes "Latest develop build — commit ${{ github.sha }}"

  # ── semver release ─────────────────────────────────────────────────────────
  publish-semver:
    name: Publish semver release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get tag
        id: tag
        run: echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" artifacts/* \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "Release ${{ steps.tag.outputs.name }}"

      - name: Overwrite latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest artifacts/* \
            --title "latest (${{ steps.tag.outputs.name }})" \
            --notes "Latest stable release — ${{ steps.tag.outputs.name }}"

  # ── Docker image ───────────────────────────────────────────────────────────
  build-push-docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            echo "tags=${{ env.IMAGE_NAME }}:develop" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            MAJOR="${TAG%%.*}"
            MINOR="${TAG%.*}"
            echo "tags=${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${MAJOR},${{ env.IMAGE_NAME }}:${MINOR},${{ env.IMAGE_NAME }}:${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: edge
          file: edge/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
