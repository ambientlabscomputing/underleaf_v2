services:
  nginx:
    image: nginx:latest
    networks:
        - underleaf
    depends_on:
      cloud_api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "19021:19021"
    volumes:
      - ./cloud/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./cloud/account_ui/dist:/usr/share/nginx/html/account_ui:ro

  cloud_api:
    build:
      context: .
      dockerfile: cloud/docker/cloud_api/Dockerfile
    image: ghcr.io/ambientlabscomputing/underleaf/cloud_api:latest
    networks:
        - underleaf
    environment:
        - UNDERLEAF_CONFIG=/etc/underleaf/config.yaml
    volumes:
        - ./configs/local/cloud_api.yaml:/etc/underleaf/config.yaml:ro
        - ./certs:/var/lib/underleaf/certs
    # No host port mapping: cloud_api trusts the X-Subject-Id header nginx
    # injects only after validating a client cert (see interface/deps.py's
    # x_subject_id_token_middleware_). Publishing 8080 directly to the host
    # would let anyone skip nginx's mTLS check and mint an access token by
    # just setting that header themselves. Reach cloud_api through nginx
    # (https://localhost) or `docker compose exec`, not localhost:8080.
    depends_on:
      postgres:
        condition: service_healthy
      conn_worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/cloud/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  conn_worker:
    build:
      context: .
      dockerfile: cloud/docker/conn_worker/Dockerfile
    image: ghcr.io/ambientlabscomputing/underleaf/conn_worker:latest
    networks:
      - underleaf
    environment:
      - UNDERLEAF_CONFIG=/etc/underleaf/config.yaml
    volumes:
      - ./configs/local/conn_worker.yaml:/etc/underleaf/config.yaml:ro
    ports:
      - "9070:9070"
      - "50102:50102"
      - "9020:9020"
    # 9021 (node_connections_port) intentionally has no host mapping: nginx's
    # stream listener on 19021 (ssl_verify_client on) is the only mTLS-checked
    # path to it. connection_manager.go's handleNewConnection does no cert
    # validation of its own, so exposing 9021 directly would let anyone open
    # a tunnel without ever presenting a client certificate.
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    networks:
      - underleaf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    networks:
    - underleaf
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  underleaf:
    driver: bridge

volumes:
  postgres_data:
