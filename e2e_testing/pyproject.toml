[project]
name = "e2e_testing"
version = "0.1.0"
description = "underleaf v2 end-to-end testing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.81.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]
markers = [
    "infra: mark test as an infrastructure test",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]
